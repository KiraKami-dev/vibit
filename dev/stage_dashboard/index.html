<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Competitor Watch</title>
<style>
:root{--bg:#ffffff;--card:#ffffff;--ink:#1c1917;--mute:#78716c;--line:#e7e5e4;--acc:#2563eb;--us:#fef3c7;--usink:#92400e;--good:#16a34a;--bad:#dc2626}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:20px;margin:0;font-weight:650;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:12px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-right:6px;animation:p 2s infinite}
.dot.off{background:var(--bad);animation:none}
@keyframes p{50%{opacity:.35}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:22px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font-size:22px;font-weight:650;font-variant-numeric:tabular-nums}
.kpi span{color:var(--mute);font-size:12px}
section{margin-bottom:26px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);margin:0 0 4px;font-weight:600}
.hint{color:var(--mute);font-size:12px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:7px 12px;white-space:nowrap}
th:first-child,td:first-child,th.l,td.l{text-align:left}
th{font-weight:500;color:var(--mute);font-size:12px;border-bottom:1px solid var(--line)}
td{border-top:1px solid var(--line)}
tr:first-child td{border-top:0}
tr.us td{background:var(--us);color:var(--usink)}
.tag{font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.tag.scored{color:var(--acc);border-color:var(--acc)}
.tag.run{color:var(--good);border-color:var(--good)}
.mute{color:var(--mute)}
.good{color:var(--good)}.bad{color:var(--bad)}
.empty{padding:16px;color:var(--mute)}
svg text{fill:var(--mute);font-size:11px}
.two{display:grid;grid-template-columns:1fr;gap:20px}
@media(min-width:900px){.two{grid-template-columns:1.1fr .9fr}}
ul.feed{list-style:none;margin:0;padding:0}
ul.feed li{padding:7px 12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
ul.feed li:first-child{border-top:0}
</style>
</head>
<body>
<main>
<header>
  <h1>Competitor Watch <span class="sub">· RFQ to bid</span></h1>
  <div class="sub"><span id="dot" class="dot"></span><span id="status">connecting…</span></div>
</header>

<div class="kpis" id="kpis"></div>

<section>
  <h2>Running now</h2>
  <p class="hint" id="liveHint"></p>
  <div class="card"><table id="live"></table></div>
</section>

<section class="two">
  <div>
    <h2>Cost vs time <span class="mute">(median of best submission · bottom-left wins)</span></h2>
    <div class="card" style="padding:8px"><svg id="scatter" viewBox="0 0 560 330" width="100%"></svg></div>
  </div>
  <div>
    <h2>Latest activity</h2>
    <div class="card"><ul class="feed" id="feed"></ul></div>
  </div>
</section>

<section>
  <h2>Test-run leaderboard</h2>
  <p class="hint" id="doneHint"></p>
  <div class="card"><table id="done"></table></div>
</section>

<section>
  <h2>Submission leaderboard</h2>
  <p class="hint">Order: eligible, then quality, then cost × time. “vs us” compares cost × time with ours.</p>
  <div class="card"><table id="board"></table></div>
</section>

</main>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtT=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(x).padStart(2,'0')};
const usd=v=>v==null?'–':v<1?'$'+v.toFixed(4):'$'+v.toFixed(2);
const num=n=>n==null?'–':n.toLocaleString('en-US');
const ago=ms=>{const s=Math.max(0,Math.round((Date.now()-ms)/1000));return s<60?s+'s ago':s<3600?Math.floor(s/60)+'m ago':Math.floor(s/3600)+'h ago'};
let S=null;

function spark(samples,key){
  if(!samples||samples.length<2)return '';
  const v=samples.map(s=>s[key]),t=samples.map(s=>s[0]);
  const w=84,h=22,t0=t[0],tn=t[t.length-1]||t0+1,mx=Math.max(...v,1);
  const pts=samples.map((s,i)=>((s[0]-t0)/Math.max(tn-t0,1)*w).toFixed(1)+','+(h-2-(v[i]/mx)*(h-4)).toFixed(1)).join(' ');
  return `<svg width="${w}" height="${h}"><polyline points="${pts}" fill="none" stroke="var(--acc)" stroke-width="1.5"/></svg>`;
}

function render(){
  if(!S)return;
  const L=S.live||{},st=L.stats||{},tk=L.tokens||{},us=S.us;
  const age=Date.now()/1000-S.polled_at;
  $('dot').className='dot'+(age>20?' off':'');
  $('status').textContent=age>20?`stage unreachable for ${Math.round(age)}s`:`live · updated ${Math.round(age)}s ago`;

  const k=[['Running now',S.running_total??st.running_now],['Model calls',tk.calls],['Tokens served',tk.tokens_served],
           ['Tokens / s',tk.tps],['Teams',st.teams],['Submissions',st.submissions],['Best quality',st.best_quality]];
  $('kpis').innerHTML=k.map(([a,b])=>`<div class="kpi"><b>${num(b)}</b><span>${a}</span></div>`).join('');

  // live runs
  const runs=[...S.window].sort((a,b)=>(b.secs||0)-(a.secs||0));
  $('liveHint').textContent=`The stage page lists only ${S.listed} of ${S.running_total??'?'} running runs (the newest starts). We record every run it shows, so each team's early pace builds up below.`;
  $('live').innerHTML=runs.length?`<thead><tr><th>Team</th><th class="l">Type</th><th class="l">Phase</th><th>Elapsed</th><th>Calls</th><th>Cost</th><th>Calls/min</th><th>$/call</th><th>Calls</th></tr></thead><tbody>`+
    runs.map(r=>{const m=r.secs>0?r.calls/(r.secs/60):null,pc=r.calls>0?r.cost/r.calls:null;
      return `<tr class="${r.team===us?'us':''}"><td>${esc(r.team)}</td><td class="l"><span class="tag ${/scored/i.test(r.kind)?'scored':''}">${esc(r.kind||'run')}</span></td>
      <td class="l"><span class="tag ${r.phase==='Running'?'run':''}">${esc(r.phase||'–')}</span></td>
      <td>${r.secs!=null?fmtT(r.secs):'–'}</td><td>${num(r.calls)}</td><td>${usd(r.cost)}</td>
      <td>${m!=null?m.toFixed(0):'–'}</td><td>${pc!=null?usd(pc):'–'}</td><td>${spark(r.samples,2)}</td></tr>`}).join('')+'</tbody>'
    :'<tbody><tr><td class="empty">No runs on the stage right now.</td></tr></tbody>';

  // leaderboard
  const E=(L.leaderboard&&L.leaderboard.entries)||[];
  const ct=e=>e.median_cost_micro_usd/1e6*e.median_duration_ms/1000;
  const me=E.find(e=>e.team_name===us),mine=me?ct(me):null;
  $('board').innerHTML=E.length?`<thead><tr><th>#</th><th class="l">Team</th><th>Quality</th><th>Cost</th><th>Time</th><th>Cost × time</th><th>vs us</th><th>Subs</th></tr></thead><tbody>`+
    E.map(e=>{const c=ct(e),ok=e.eligible&&e.median_duration_ms>0;
      let d='';if(mine&&ok&&e.team_name!==us){const p=(c/mine-1)*100;d=`<span class="${p<0?'bad':'good'}">${p<0?'':'+'}${p.toFixed(0)}%</span>`}
      return `<tr class="${e.team_name===us?'us':''}"><td>${e.rank}</td><td class="l">${esc(e.team_name)}${e.eligible?'':' <span class="tag">ineligible</span>'}</td>
      <td>${e.median_quality}</td><td>${ok?usd(e.median_cost_micro_usd/1e6):'–'}</td><td>${ok?fmtT(e.median_duration_ms/1000):'–'}</td>
      <td>${ok?c.toFixed(1):'–'}</td><td>${d}</td><td>${e.submission_count}</td></tr>`}).join('')+'</tbody>'
    :'<tbody><tr><td class="empty">Waiting for leaderboard…</td></tr></tbody>';
  $('board').insertAdjacentHTML('afterend','');
  scatter(E,us);

  // test-run leaderboard (early pace, from every test run the stage has shown)
  const T={};
  for(const r of S.all){
    if(!/test/i.test(r.kind||'')||!(r.secs>=20)||!(r.calls>0))continue;
    const t=T[r.team]||(T[r.team]={team:r.team,runs:0,secs:0,calls:0,cost:0,deep:0,last:0});
    t.runs++;t.secs+=r.secs;t.calls+=r.calls;t.cost+=r.cost;t.deep=Math.max(t.deep,r.secs);t.last=Math.max(t.last,r.last);
  }
  const TL=Object.values(T).sort((a,b)=>a.cost/a.secs-b.cost/b.secs);
  const dwell=S.all.filter(r=>r.last>r.first).map(r=>r.last-r.first);
  const avgDwell=dwell.length?dwell.reduce((a,b)=>a+b,0)/dwell.length:null;
  $('doneHint').textContent=`Test runs only, no quality. Built from what the stage shows: early-run pace, not final totals. ${S.all.length} runs recorded`+(avgDwell?`, each visible about ${fmtT(avgDwell)} on average`:'')+'. Sorted by cost per minute, cheapest first.';
  $('done').innerHTML=TL.length?`<thead><tr><th>#</th><th class="l">Team</th><th>Runs seen</th><th>Calls/min</th><th>Cost/min</th><th>$/call</th><th>Avg at last sight</th><th>Furthest seen</th><th>Last seen</th></tr></thead><tbody>`+
    TL.map((t,i)=>`<tr class="${t.team===us?'us':''}"><td>${i+1}</td><td class="l">${esc(t.team)}</td><td>${t.runs}</td>
    <td>${(t.calls/t.secs*60).toFixed(0)}</td><td>${usd(t.cost/t.secs*60)}</td><td>${usd(t.cost/t.calls)}</td>
    <td>${fmtT(t.secs/t.runs)}</td><td>${fmtT(t.deep)}</td><td class="mute">${ago(t.last*1000)}</td></tr>`).join('')+'</tbody>'
    :'<tbody><tr><td class="empty">No test runs recorded yet.</td></tr></tbody>';

  // feed
  const ev=((L.activity&&L.activity.events)||[]).slice(0,14);
  const say=e=>{const d=e.data||{};switch(e.type){
    case'submitted':return'submitted a package';
    case'reviewed':return d.passed?'passed review':'failed review';
    case'evaluated':return d.eligible?`scored quality ${d.median_quality} (rank ${d.rank})`:'scored: not eligible';
    case'rank_changed':return `moved #${d.from} → #${d.to}`;
    default:return e.type}};
  $('feed').innerHTML=ev.map(e=>`<li><span><b>${esc(e.team_name||'')}</b> ${esc(say(e))}</span><span class="mute">${ago(e.at)}</span></li>`).join('')||'<li class="mute">No activity.</li>';
}

function scatter(E,us){
  const P=E.filter(e=>e.eligible&&e.median_duration_ms>0&&e.median_cost_micro_usd>0);
  const svg=$('scatter');if(!P.length){svg.innerHTML='';return}
  const W=560,H=330,m={l:46,r:16,t:12,b:34};
  const xs=P.map(e=>e.median_duration_ms/60000),ys=P.map(e=>e.median_cost_micro_usd/1e6);
  const xmax=Math.ceil(Math.max(...xs)+1),ylo=Math.log10(Math.min(...ys)/1.5),yhi=Math.log10(Math.max(...ys)*1.5);
  const X=v=>m.l+v/xmax*(W-m.l-m.r),Y=v=>m.t+(1-(Math.log10(v)-ylo)/(yhi-ylo))*(H-m.t-m.b);
  let o='';
  for(let x=0;x<=xmax;x+=Math.max(1,Math.round(xmax/6)))o+=`<line x1="${X(x)}" x2="${X(x)}" y1="${m.t}" y2="${H-m.b}" stroke="var(--line)"/><text x="${X(x)}" y="${H-m.b+14}" text-anchor="middle">${x}m</text>`;
  for(let p=Math.floor(ylo);p<=Math.ceil(yhi);p++){const v=10**p;if(Math.log10(v)<ylo||Math.log10(v)>yhi)continue;
    o+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${m.l-6}" y="${Y(v)+4}" text-anchor="end">$${v<1?v:v}</text>`}
  o+=P.map(e=>{const x=X(e.median_duration_ms/60000),y=Y(e.median_cost_micro_usd/1e6),u=e.team_name===us,top=e.median_quality>=100;
    const fill=u?'#f59e0b':top?'var(--acc)':'var(--mute)';
    return `<circle cx="${x}" cy="${y}" r="${u?7:5}" fill="${fill}" fill-opacity="${top||u?1:.45}"><title>${esc(e.team_name)} · q${e.median_quality} · ${usd(e.median_cost_micro_usd/1e6)} · ${fmtT(e.median_duration_ms/1000)}</title></circle>
    <text x="${x+8}" y="${y+4}" style="${u?'fill:var(--usink);font-weight:600':''}">${esc(e.team_name.length>14?e.team_name.slice(0,13)+'…':e.team_name)}</text>`}).join('');
  o+=`<text x="${W-m.r}" y="${H-4}" text-anchor="end">minutes →</text>`;
  svg.innerHTML=o;
}

const US=new URLSearchParams(location.search).get('us')||'error404.ai';
function ingest(snap){
  const hist=Object.entries(snap.runs||{}).map(([id,r])=>({id,team:r.team,kind:r.kind,phase:r.phase,
    secs:r.secs,calls:r.calls,cost:r.cost,first:r.first,last:r.last,samples:r.s||[]}));
  const inWin=new Set(snap.rows.map(r=>r.id));
  S={us:US,polled_at:snap.at,running_total:snap.running_total,listed:snap.rows.length,
     window:hist.filter(r=>inWin.has(r.id)),all:hist,live:snap.live,errors:snap.errors||{}};
}

async function tick(){
  try{
    const r=await fetch('api/state',{cache:'no-store'});
    if(!r.ok)throw new Error(r.status);
    ingest(await r.json());render();
  }catch(e){$('dot').className='dot off';$('status').textContent='data source unreachable, retrying'}
}
tick();setInterval(tick,5000);setInterval(render,1000);
</script>
</body>
</html>
